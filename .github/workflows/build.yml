name: Build

on:
  push:
    branches:
      - main
      - refactor/cross-platform-foundation
  pull_request:

jobs:
  compile:
    name: Compile on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build all projects (no tests)
        run: dotnet build CodexMonitor.slnx --configuration Release --nologo
