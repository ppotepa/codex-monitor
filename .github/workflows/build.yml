name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: Compile on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build all projects
        shell: pwsh
        run: |
          dotnet build CodexMonitor.slnx --configuration Release --nologo 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run parser and persistence checks
        shell: pwsh
        run: dotnet run --project tests/ParserChecks.csproj --configuration Release
      - name: Keep build output for code review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log-${{ matrix.os }}
          path: build.log
          retention-days: 3
          if-no-files-found: ignore
