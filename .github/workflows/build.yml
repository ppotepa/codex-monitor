name: Build

on:
  push:
    branches:
      - main
      - cleanup/fresh-baseline-no-migrations
      - refactor/unified-avalonia-ui
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Build and application checks run on every PR.
      - name: Build complete solution
        shell: pwsh
        run: |
          dotnet build CodexMonitor.slnx --configuration Release --nologo 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run parser and workspace checks
        shell: pwsh
        run: dotnet run --project tests/ParserChecks.csproj --configuration Release --no-restore
      - name: Run parser, provider and workspace regression checks
        shell: pwsh
        run: |
          dotnet run --project tests/ParserChecks.csproj --configuration Release --no-launch-profile --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log-${{ matrix.os }}
          path: build.log
          retention-days: 3
          if-no-files-found: ignore
